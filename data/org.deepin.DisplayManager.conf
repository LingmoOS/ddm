<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <policy user="root">
    <allow own="org.lingmo.DisplayManager"/>
    <allow send_destination="org.lingmo.DisplayManager" send_interface="org.lingmo.DisplayManager" send_member="AuthInfo"/>
  </policy>

  <policy user="dde">
    <allow send_destination="org.lingmo.DisplayManager" send_interface="org.lingmo.DisplayManager" send_member="AuthInfo"/>
  </policy>

  <policy group="default">
    <allow send_destination="org.lingmo.DisplayManager" />
    <allow send_destination="org.lingmo.DisplayManager"
            send_interface="org.lingmo.DisplayManager"/>
    <allow send_destination="org.lingmo.DisplayManager"
            send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.lingmo.DisplayManager"
            send_interface="org.freedesktop.DBus.Introspectable"/>
    <deny send_interface="org.lingmo.DisplayManager" send_member="AuthInfo"/>
  </policy>
</busconfig>

